    --bg: #74e9e2;
    --panel: #1c7d70;
    --panel-2: #2ba597;
    --accent: #5fddc9;
    --accent-strong: #1f9077;
    --accent2: #a8e4da;

    --card-normal-border: #8bd9c8;

    background: var(--bg);

<!--
  PNG簡易暗号化(.png-arnie-ango)対応ユーティリティ。
  ローカルのPNGは元ファイル名に "-arnie-ango" を足した暗号化版に置き換わって
  いることがある（convert_ango.py 参照）。暗号化版があればfetchして復号し
  Blob URL化して表示、無ければ素のPNGパスをそのまま使う。
  アルゴリズム: バイト列反転 → 固定鍵で1バイトずつXOR（convert_ango.py と同一・
  同じ鍵にすること）。
-->
<script>
  var ANGO_KEY    = 'arnie-ango';
  var ANGO_SUFFIX = '-arnie-ango';
  var imgSrcCache = {};

  function angoXor(bytes) {
    var key = new TextEncoder().encode(ANGO_KEY);
    var out = new Uint8Array(bytes.length);
    for (var i = 0; i < bytes.length; i++) out[i] = bytes[i] ^ key[i % key.length];
    return out;
  }

  function angoDecrypt(buf) {
    var unxored = angoXor(new Uint8Array(buf));
    return unxored.reverse();
  }

  /**
   * ローカルPNG画像の実際のsrc（表示に使えるURL）を解決する。
   * <path>-arnie-ango（暗号化版）を取得できればそれを復号してBlob URL化し、
   * 取得できなければ素の<path>をそのまま返す。結果はpathごとにキャッシュする。
   */
  async function loadImageSrc(path) {
    if (imgSrcCache[path]) return imgSrcCache[path];
    try {
      const res = await fetch(path + ANGO_SUFFIX);
      if (res.ok) {
        const decrypted = angoDecrypt(await res.arrayBuffer());
        const url = URL.createObjectURL(new Blob([decrypted], { type: 'image/png' }));
        imgSrcCache[path] = url;
        return url;
      }
    } catch (_) { /* 暗号化ファイルが無い/取得失敗 → 素のPNGにフォールバック */ }
    imgSrcCache[path] = path;
    return path;
  }

  /** data-img="論理パス" を持つ<img>をまとめて解決する（静的に書かれたローカル画像用） */
  async function hydrateLocalImages(root) {
    const els = (root || document).querySelectorAll('img[data-img]');
    await Promise.all(Array.from(els).map(async img => {
      img.src = await loadImageSrc(img.dataset.img);
    }));
  }
</script>

<script>
// ============================================================
// UTILITIES
// ============================================================

function getVideoId(url) {
  const m = url.match(/[?&]v=([^&\s]+)/);
  return m ? m[1] : null;
}

function thumbUrl(videoId) {
  return `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
}

/** タイムスタンプ文字列（例: "1:23:45" or "4:56"）を秒数に変換 */
function tsToSeconds(ts) {
  const parts = ts.trim().split(':').map(Number);
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  return 0;
}

/** タイトルから末尾の装飾（絵文字・コメント等）を除去 */

function cleanTitle(raw) {
  return raw
//    .replace(/[🍆🌸✨💫⭐🎵🎶🎤🎸🎹🥁🎷🎺🪗🎻🎼🎙️🔊🍑]+.*$/u, '')
    .replace(/＜[^\s]*/g, '')
    .trim();
}

/**
 * 「曲名 / アーティスト名 # 備考 [TODO|ERROR]」形式の行を分解する。
 * ①最初のスペースでタイムスタンプと切り離した残り文字列を受け取る想定。
 * ②アーティスト名との区切りは最後の半角スラッシュ（曲名側にスラッシュを含められる）。
 *   アーティスト名自体に "/" が入る場合（例: DISH//）は
 *   `曲名 / "DISH//"` のように "..." で囲んで区切りの曖昧さを回避する。
 */
function parseSongLine(raw) {
  let s = raw.trim();
  let flag = null;

  const flagMatch = s.match(/\s*\[(TODO|ERROR)\]\s*$/);
  if (flagMatch) {
    flag = flagMatch[1];
    s = s.slice(0, flagMatch.index).trim();
  }

  let remark = null;
  const hashIdx = s.indexOf(' # ');
  if (hashIdx >= 0) {
    remark = s.slice(hashIdx + 3).trim();
    s = s.slice(0, hashIdx).trim();
  }

  let artist = null;
  // アーティスト名自体に "/" を含む場合は `"DISH//"` のように " / \"...\"" で
  // 引用符囲みされている想定。それ以外は通常どおり最後の "/" で分割する。
  const quotedMatch = s.match(/\s\/\s"([^"]*)"\s*$/);
  if (quotedMatch) {
    artist = quotedMatch[1].trim();
    s = s.slice(0, quotedMatch.index).trim();
  } else {
    const slashIdx = s.lastIndexOf('/');
    if (slashIdx >= 0) {
      artist = s.slice(slashIdx + 1).trim();
      s = s.slice(0, slashIdx).trim();
    }
  }

  const title = cleanTitle(s);
  return { contentTitle: title || s, artist, remark, flag };
}

// ============================================================
// DATABASE PARSER
// ============================================================

/**
 * databaseテキストを解析してアイテム配列を返す
 * @returns {{ mvItems, liveItems, pendingItems, infoBlocks }}
 *
 * Item      = { videoId, url, contentTitle, artist, remark, flag, isVoicechanger, timestamp }
 * infoBlock = { type: 'table'|'danmaku'|'list', heading, images:[], rows:[[k,v]], items:[] }
 *
 * ■information セクションの記法:
 *   >>table 見出し     … 続く「キー | 値」行を2列表に。値がURLならリンク化
 *   >>danmaku 見出し   … 続く各行を1件ずつコピー可能な行に。先頭 // は注釈行
 *   >>list 見出し      … 続く各行を箇条書きに（先頭の「・」は除去）
 *   @image パス        … ブロック内のどこでも可。SDキャラ等を画像として添える
 *                        （広い画面では左側、狭い画面では見出しと本文の間に表示）。
 *                        同じブロックに複数書くと、表示のたびにその中から
 *                        ランダムで1枚選ばれる
 */
function parseDatabase(text) {
  const lines       = text.split('\n').map(l => l.trim());
  const mvItems      = [];
  const liveItems    = [];
  const pendingItems = [];
  const infoBlocks   = [];

  // タイムスタンプ行にマッチ: 先頭が「数字:数字」で始まる
  const TS_RE = /^(\d+:\d+(?::\d+)?)\s+(.+)$/;

  let section    = null;
  let currentUrl = null;
  let currentVc  = false;
  let infoBlock  = null;

  for (const line of lines) {
    if (!line) continue;

    // ---- セクションヘッダ ----
    // 「準備中」を先に判定（「歌ってみた枠」の部分一致を避けるため）
    if (line.startsWith('■') && line.includes('準備中')) {
      section = 'pending'; currentUrl = null; infoBlock = null; continue;
    }
    if (line === '■Music Video') {
      section = 'mv'; currentUrl = null; infoBlock = null; continue;
    }
    if (line === '■歌ってみた枠') {
      section = 'live'; currentUrl = null; infoBlock = null; continue;
    }
    if (line === '■information' || line === '■インフォメーション') {
      section = 'info'; currentUrl = null; infoBlock = null; continue;
    }

    // ---- information セクション ----
    if (section === 'info') {
      const bm = line.match(/^>>(table|danmaku|list)\b\s*(.*)$/);
      if (bm) {
        infoBlock = { type: bm[1], heading: bm[2].trim(), images: [], rows: [], items: [] };
        infoBlocks.push(infoBlock);
        continue;
      }
      if (!infoBlock) continue;
      if (line.startsWith('@image')) {
        infoBlock.images.push(line.slice(6).trim());
        continue;
      }
      if (infoBlock.type === 'table') {
        const bar = line.indexOf('|');
        if (bar >= 0) infoBlock.rows.push([line.slice(0, bar).trim(), line.slice(bar + 1).trim()]);
        else          infoBlock.rows.push(['', line]);
      } else if (infoBlock.type === 'danmaku') {
        if (line.startsWith('//')) infoBlock.items.push({ note: true,  text: line.slice(2).trim() });
        else                       infoBlock.items.push({ note: false, text: line });
      } else { // list
        infoBlock.items.push(line.replace(/^[・･·]\s*/, ''));
      }
      continue;
    }

    // ---- URL行 ----
    if (line.startsWith('https://')) {
      currentUrl = line;
      currentVc  = false; // URLが変わったらボイチェンフラグをリセット

      if (section === 'mv') {
        const vid = getVideoId(currentUrl);
        if (vid) mvItems.push({ videoId: vid, url: currentUrl, contentTitle: null, isVoicechanger: false, timestamp: null });
        currentUrl = null;
      } else if (section === 'pending') {
        const vid = getVideoId(currentUrl);
        if (vid) pendingItems.push({ videoId: vid, url: currentUrl, contentTitle: null, isVoicechanger: false, timestamp: null });
        currentUrl = null;
      }
      // live セクションは後続のタイムスタンプ行を待つ
      continue;
    }

    // ---- ボイチェン行（URLの直下） ----
    if (section === 'live' && line === 'ボイチェン') {
      currentVc = true;
      continue;
    }

    // ---- タイムスタンプ行（歌ってみた枠） ----
    if (section === 'live' && currentUrl) {
      const m = TS_RE.exec(line);
      if (m) {
        const ts     = m[1];
        const parsed = parseSongLine(m[2]);
        const secs   = tsToSeconds(ts);
        const vid    = getVideoId(currentUrl);
        if (vid) {
          liveItems.push({
            videoId:        vid,
            url:            `https://www.youtube.com/watch?v=${vid}&t=${secs}`,
            contentTitle:   parsed.contentTitle,
            artist:         parsed.artist,
            remark:         parsed.remark,
            flag:           parsed.flag,
            isVoicechanger: currentVc,
            timestamp:      ts,
          });
        }
      }
    }
  }

  return { mvItems, liveItems, pendingItems, infoBlocks };
}

// ============================================================
// YOUTUBE タイトル取得
//   YouTube公式oEmbedを主、noembedを従に。成功したものだけキャッシュ。
//   （失敗はキャッシュしないので、あとの再試行パスで拾い直せる）
// ============================================================

const videoInfoCache = {};

/** タイムアウト付きでJSONを取得。失敗時は null */
async function fetchJsonWithTimeout(url, timeoutMs = 8000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) return null;
    return await res.json();
  } catch {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

async function fetchVideoInfo(videoId) {
  const cached = videoInfoCache[videoId];
  if (cached && cached.title) return cached;

  const watchUrl = `https://www.youtube.com/watch?v=${videoId}`;
  let title = '';

  // 1) YouTube公式 oEmbed（CORSヘッダーを返すので直接叩ける。最も確実）
  const a = await fetchJsonWithTimeout(
    `https://www.youtube.com/oembed?format=json&url=${encodeURIComponent(watchUrl)}`
  );
  if (a && a.title) title = a.title;

  // 2) フォールバック: noembed
  if (!title) {
    const b = await fetchJsonWithTimeout(
      `https://noembed.com/embed?url=${encodeURIComponent(watchUrl)}`
    );
    if (b && b.title) title = b.title;
  }

  const info = { title };
  if (title) videoInfoCache[videoId] = info; // 成功時のみ保存（失敗は再試行パスで拾い直す）
  return info;
}

// ============================================================
// STATE
// ============================================================

let mvItems      = [];
let liveItems    = [];
let pendingItems = [];
let infoBlocks   = [];
let activeTab    = 'mv';
let searchQuery  = '';

// ============================================================
// RENDER
// ============================================================

function makeCard(item) {
  const info   = videoInfoCache[item.videoId] || {};
  const title  = item.contentTitle || info.title || item.videoId;
  const isVC   = item.isVoicechanger || !!(info.title && info.title.includes('ボイチェン'));

  const card = document.createElement('a');
  card.className = `card ${isVC ? 'vc' : 'normal'}`;
  card.href      = item.url;
  card.target    = '_blank';
  card.rel       = 'noopener noreferrer';

  const thumbWrap = document.createElement('div');
  thumbWrap.className = 'card-thumb-wrap';

  const thumb = document.createElement('img');
  thumb.className = 'card-thumb';
  thumb.loading   = 'lazy';
  thumb.src       = thumbUrl(item.videoId);
  thumb.alt       = title;
  thumbWrap.appendChild(thumb);

  const body    = document.createElement('div');
  body.className = 'card-body';

  const titleEl    = document.createElement('div');
  titleEl.className = 'card-title';
  titleEl.textContent = title;

  const meta    = document.createElement('div');
  meta.className = 'card-meta';

  if (item.timestamp) {
    const tsEl    = document.createElement('span');
    tsEl.className = 'card-ts';
    tsEl.textContent = item.timestamp;
    meta.appendChild(tsEl);
  }

  if (item.artist) {
    const artistEl    = document.createElement('span');
    artistEl.className = 'card-artist';
    artistEl.textContent = item.artist;
    meta.appendChild(artistEl);
  }

  if (item.remark) {
    const remarkEl    = document.createElement('span');
    remarkEl.className = 'card-remark';
    remarkEl.textContent = item.remark;
    meta.appendChild(remarkEl);
  }

  if (isVC) {
    const badge    = document.createElement('span');
    badge.className = 'badge-vc';
    badge.textContent = 'ボイチェン';
    meta.appendChild(badge);
  }

  if (item.flag) {
    const flagEl    = document.createElement('span');
    flagEl.className = 'badge-flag';
    flagEl.textContent = '要確認';
    flagEl.title = item.flag === 'ERROR'
      ? 'アーティスト名にスラッシュが含まれるため要修正'
      : 'アーティスト未確定・複数候補あり';
    meta.appendChild(flagEl);
  }

  body.appendChild(titleEl);
  body.appendChild(meta);
  card.appendChild(thumbWrap);
  card.appendChild(body);
  return card;
}

/** URLらしき文字列ならリンク要素を、そうでなければテキストを td に入れる */
function appendInfoValue(td, value) {
  if (/^https?:\/\//i.test(value)) {
    const a = document.createElement('a');
    a.href = value;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = value;
    td.appendChild(a);
  } else {
    td.textContent = value;
  }
}

function renderInfo(container) {
  container.innerHTML = '';
  infoBlocks.forEach(block => {
    const sec = document.createElement('section');
    sec.className = 'info-block';

    // 見出し・本文を一旦配列にためる（画像ありブロックはあとでラップし直す）
    const bodyEls = [];

    if (block.heading) {
      const h = document.createElement('h2');
      h.className = 'info-heading';
      h.textContent = block.heading;
      bodyEls.push(h);
    }

    if (block.type === 'table') {
      const tbl = document.createElement('table');
      tbl.className = 'info-table';
      block.rows.forEach(([k, v]) => {
        const tr = document.createElement('tr');
        if (k) {
          const th = document.createElement('th');
          th.textContent = k;
          tr.appendChild(th);
          const td = document.createElement('td');
          appendInfoValue(td, v);
          tr.appendChild(td);
        } else {
          const td = document.createElement('td');
          td.colSpan = 2;
          appendInfoValue(td, v);
          tr.appendChild(td);
        }
        tbl.appendChild(tr);
      });
      bodyEls.push(tbl);

    } else if (block.type === 'danmaku') {
      block.items.forEach(it => {
        if (it.note) {
          const p = document.createElement('p');
          p.className = 'info-note';
          p.textContent = it.text;
          bodyEls.push(p);
          return;
        }
        const row = document.createElement('div');
        row.className = 'danmaku-row';
        const span = document.createElement('span');
        span.className = 'danmaku-text';
        span.textContent = it.text;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'danmaku-copy';
        btn.textContent = 'コピー';
        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(it.text);
            btn.textContent = 'コピー済み';
            setTimeout(() => { btn.textContent = 'コピー'; }, 1500);
          } catch (_) { /* クリップボード不可環境では無視 */ }
        });
        row.appendChild(span);
        row.appendChild(btn);
        bodyEls.push(row);
      });

    } else { // list
      const ul = document.createElement('ul');
      ul.className = 'info-list';
      block.items.forEach(t => {
        const li = document.createElement('li');
        li.textContent = t;
        ul.appendChild(li);
      });
      bodyEls.push(ul);
    }

    if (block.images && block.images.length) {
      // 画像あり: 広い画面では左に画像＋右に本文、狭い画面では見出しと本文の間に画像
      // 複数指定されていれば表示のたびにランダムで1枚選ぶ
      sec.classList.add('has-avatar');

      const pick = block.images[Math.floor(Math.random() * block.images.length)];
      const avatarWrap = document.createElement('div');
      avatarWrap.className = 'info-avatar-wrap';
      const img = document.createElement('img');
      img.className = 'info-avatar';
      img.alt = '';
      img.loading = 'lazy';
      loadImageSrc(pick).then(url => { img.src = url; });
      avatarWrap.appendChild(img);

      const content = document.createElement('div');
      content.className = 'info-content';
      bodyEls.forEach(el => content.appendChild(el));

      sec.appendChild(avatarWrap);
      sec.appendChild(content);
    } else {
      bodyEls.forEach(el => sec.appendChild(el));
    }

    container.appendChild(sec);
  });
}

function render() {
  const grid      = document.getElementById('cardsGrid');
  const infoPanel = document.getElementById('infoPanel');
  const noResults = document.getElementById('noResults');
  const label     = document.getElementById('sectionLabel');
  const tabs      = document.getElementById('tabsContainer');
  grid.innerHTML  = '';

  const q = searchQuery.trim().toLowerCase();

  // ---- information タブ（検索していないとき） ----
  if (!q && activeTab === 'info') {
    tabs.style.opacity = '1';
    grid.hidden = true;
    infoPanel.hidden = false;
    noResults.style.display = 'none';
    label.textContent = '■ information';
    renderInfo(infoPanel);
    return;
  }
  grid.hidden = false;
  infoPanel.hidden = true;

  let items;
  if (q) {
    tabs.style.opacity = '0.5';
    items = [...mvItems, ...liveItems, ...pendingItems].filter(item => {
      const info = videoInfoCache[item.videoId] || {};
      const ct   = (item.contentTitle || '').toLowerCase();
      const vt   = (info.title || '').toLowerCase();
      const at   = (item.artist || '').toLowerCase();
      return ct.includes(q) || vt.includes(q) || at.includes(q);
    });
    label.textContent = `「${searchQuery}」の検索結果 ${items.length}件`;
  } else {
    tabs.style.opacity = '1';
    if      (activeTab === 'mv')      items = mvItems;
    else if (activeTab === 'live')    items = liveItems;
    else                              items = pendingItems;
    const names = {
      mv:      '■ Music Video',
      live:    '■ 歌枠',
      pending: '■ 準備中',
      info:    '■ information',
    };
    label.textContent = `${names[activeTab]} — ${items.length}件`;
  }

  if (items.length === 0) {
    noResults.style.display = 'block';
  } else {
    noResults.style.display = 'none';
    items.forEach((item, i) => {
      const card = makeCard(item);
      card.style.animationDelay = `${Math.min(i * 0.02, 0.6)}s`;
      grid.appendChild(card);
    });
  }
}

// ============================================================
// INIT
// ============================================================

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeTab   = tab.dataset.tab;
    searchQuery = '';
    document.getElementById('searchInput').value = '';
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

const LOADING_MIN_MS = 2000; // ロード演出を最低このくらいは見せる（実際の読み込みが速くても待つ）
const loadingStartedAt = Date.now();

// 各種リンクアイコン等、静的に data-img="..." で書かれたローカル画像を解決
hydrateLocalImages();

(async () => {
  // Step 1: databaseファイルをfetchして解析
  try {
    const res = await fetch('./database');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text   = await res.text();
    const parsed = parseDatabase(text);
    mvItems      = parsed.mvItems;
    liveItems    = parsed.liveItems;
    pendingItems = parsed.pendingItems;
    infoBlocks   = parsed.infoBlocks;

    // 該当コンテンツが無ければタブごと非表示
    if (pendingItems.length === 0) {
      const t = document.querySelector('.tab[data-tab="pending"]');
      if (t) t.remove();
    }
    if (infoBlocks.length === 0) {
      const t = document.querySelector('.tab[data-tab="info"]');
      if (t) t.remove();
    }
  } catch (err) {
    console.error('database 読み込みエラー:', err);
    document.getElementById('loadingText').textContent =
      'データの読み込みに失敗しました。\ndatabaseファイルがindex.htmlと同じディレクトリにあるか確認してください。\n（ローカルのfile://では動作しません。GitHub Pages等のサーバーが必要です）';
    return;
  }

  // Step 2: 最低表示時間を確保してからローディング非表示・初期描画（カード枠のみ先に表示）
  const remaining = LOADING_MIN_MS - (Date.now() - loadingStartedAt);
  if (remaining > 0) await new Promise(r => setTimeout(r, remaining));

  const overlay = document.getElementById('loadingOverlay');
  overlay.classList.add('hidden');
  setTimeout(() => overlay.remove(), 500);
  render();

  // Step 3: バックグラウンドでYouTubeタイトルを順次取得、取得のたびに再描画
  const allIds = [...new Set([
    ...mvItems.map(i => i.videoId),
    ...liveItems.map(i => i.videoId),
    ...pendingItems.map(i => i.videoId),
  ])];

  const BATCH_SIZE = 5;
  const gotTitle = id => !!(videoInfoCache[id] && videoInfoCache[id].title);

  async function runPass(ids) {
    for (let i = 0; i < ids.length; i += BATCH_SIZE) {
      await Promise.allSettled(ids.slice(i, i + BATCH_SIZE).map(id => fetchVideoInfo(id)));
      render();
      await new Promise(r => setTimeout(r, 150));
    }
  }

  // 初回 + 取得できなかったIDの再試行（最大3回）
  await runPass(allIds);
  for (let attempt = 0; attempt < 3; attempt++) {
    const missing = allIds.filter(id => !gotTitle(id));
    if (missing.length === 0) break;
    await new Promise(r => setTimeout(r, 1000));
    await runPass(missing);
  }
})();
